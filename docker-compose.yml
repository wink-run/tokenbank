services:

  # ── PostgreSQL（pgvector）────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg17
    container_name: pg-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-tokenbank}
      TZ: Asia/Shanghai
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    deploy:
      resources:
        reservations:
          cpus: "0.5"
          memory: 512M
        limits:
          cpus: "1"
          memory: 2G
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-root} -d ${POSTGRES_DB:-tokenbank}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Backend API server ───────────────────────────────────────────────────────
  proxy:
    build:
      context: ./server
    ports:
      - "8000:8000"
    expose:
      - "8000"
    env_file: .env
    environment:
      # 容器内固定连 postgres 服务名，覆盖 .env 里面向 localhost 的配置
      DATABASE_URL: postgresql://${POSTGRES_USER:-root}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-tokenbank}
    volumes:
      - app_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # 一次性 SQLite → PostgreSQL 迁移
  # 用法: ./scripts/migrate-sqlite-to-pg.sh --from-compose
  # 或: docker compose --profile migrate run --rm -v <卷名>:/data:ro migrate
  migrate:
    profiles: [migrate]
    build:
      context: ./server
    volumes:
      - ./server:/app:ro
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-root}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-tokenbank}
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["python", "migrate_sqlite_to_pg.py"]
    command: ["--sqlite", "/data/proxy.db", "--truncate"]

  # ── Nginx HTTPS 反代（绑定域名）────────────────────────────────────────────
  # 用法见 .env.example：放置证书后 docker compose --profile https up -d
  nginx:
    image: nginx:1.27-alpine
    profiles: [https]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-tokenbank.example.com}
      UPSTREAM: ${NGINX_UPSTREAM:-proxy:8000}
      GATEWAY_DOMAIN: ${GATEWAY_DOMAIN:-gateway.example.com}
      GATEWAY_UPSTREAM: ${GATEWAY_UPSTREAM:-gateway:11431}
    volumes:
      - ./nginx/templates/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - proxy
    restart: unless-stopped

  # 可选：同时为 CLI Gateway 配置 HTTPS（需 gateway-fullchain.pem 等）
  nginx-gateway:
    image: nginx:1.27-alpine
    profiles: [gateway-https]
    ports:
      - "8443:443"
      - "8080:80"
    environment:
      GATEWAY_DOMAIN: ${GATEWAY_DOMAIN:-gateway.example.com}
      GATEWAY_UPSTREAM: ${GATEWAY_UPSTREAM:-gateway:11431}
    volumes:
      - ./nginx/templates/gateway.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - gateway
    restart: unless-stopped

  # ── 设备网络独立中继（可选，扩容时用）──────────────────────────────────────
  # 默认不用它：后端（proxy）内置了官方中继 /mesh/ws，什么都不用配。
  # 多个后端实例、或想把中继流量和 API 分开时才起这个，见 DEPLOY.md「设备网络」：docker compose --profile mesh up -d mesh-relay
  mesh-relay:
    build:
      context: .
      dockerfile: deploy/mesh-relay/Dockerfile
    profiles: [mesh]
    expose:
      - "8790"
    environment:
      # 每分钟从服务端拉一次签发公钥和被吊销的设备
      # 服务端不在同一个 compose 里时改成公网地址，如 https://<域名>/mesh/revoked-endpoints
      MESH_REVOCATIONS_URL: ${MESH_REVOCATIONS_URL:-http://proxy:8000/mesh/revoked-endpoints}
      MESH_RELAY_ACCESS_TOKEN: ${MESH_RELAY_ACCESS_TOKEN:-}
      # 可选：签发公钥（kid:x，逗号分隔），拉不到服务端时也能先放行有效证书
      MESH_ISSUER_PUBLIC_KEYS: ${MESH_ISSUER_PUBLIC_KEYS:-}
      MESH_RELAY_MAX_PER_USER: ${MESH_RELAY_MAX_PER_USER:-20}
    depends_on:
      - proxy
    restart: unless-stopped

  # ── CLI Gateway (headless, no Electron) ──────────────────────────────────────
  gateway:
    # 固定主机名：盘点里的设备名不随容器重建变（也可以用环境变量 TB_DEVICE_NAME 指定）
    hostname: tokenbank-gateway
    build:
      context: ./client
      dockerfile: Dockerfile.cli
    ports:
      - "11430:11430"   # OpenAI 网关；设备网络也走这个端口（/mesh/ws），不再另开端口
      - "11431:11431"   # Admin API + Web UI
    volumes:
      # 整个 /data：命令行智能体（装在 /data/.npm-global）、它们的登录状态（~/.claude、~/.pi…）、资产库
      - gateway_home:/data
      - ./gateway-data:/data/.llm-agent          # 配置；local-config.json 首次启动自动创建
      - ./gateway-data/tokenbank:/data/.tokenbank # 请求记录 / 用量库，重启容器后保留
      - ./workspace:/workspace                   # 智能体默认工作目录：放要处理的项目
    environment:
      - HOME=/data
      - NODE_ENV=production
      - GATEWAY_BIND_HOST=0.0.0.0
      - TOKEN_SERVER_URL=https://tokenbank.wink.run/
      # 出口 IP 不是要公布的公网地址时再填，例如 203.0.113.5 或 203.0.113.5:11430。不填就用云端看到的出口 IP
      - MESH_PUBLIC_ADDR=${MESH_PUBLIC_ADDR:-}
      # 容器以普通用户运行（默认 1000）；想让 ./gateway-data、./workspace 归宿主机用户，改成 `id -u` / `id -g`
      # - TOKENBANK_UID=1000
      # - TOKENBANK_GID=1000
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - |
          require('http').get('http://localhost:11431/api/gateway/status', r => {
            process.exit(r.statusCode === 200 ? 0 : 1);
          }).on('error', () => process.exit(1));
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  app_data:
  pgdata:
  certbot_www:
  gateway_home:
