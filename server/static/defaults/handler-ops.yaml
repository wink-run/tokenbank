# handler-ops.yaml — 运营可覆盖的展示/计费元数据（key = handler id）
version: 1

ops:
  claude-code-cli:
    install_url: https://claude.com/claude-code
    npm_package: '@anthropic-ai/claude-code'
    install_guide:
      mac: '1. 点击下方「打开官方链接」下载 Claude Code

        2. 或终端执行：brew install --cask claude-code

        3. 安装完成后点击百宝箱右上角刷新；图标变彩色即表示已识别

        '
      win: '1. 点击下方「打开官方链接」下载 Windows 安装包

        2. 运行安装程序并按提示完成安装

        3. 安装完成后点击百宝箱右上角刷新；图标变彩色即表示已识别

        '
    uninstall_guide:
      mac: '1. 打开「应用程序」，将 Claude Code 拖入废纸篓

        2. 或通过 Homebrew：brew uninstall --cask claude-code

        3. 刷新百宝箱，图标将变为灰色

        '
      win: '1. 打开「设置 → 应用 → 已安装的应用」

        2. 找到 Claude Code，点击「卸载」

        3. 刷新百宝箱，图标将变为灰色

        '
    pricing_provider_id: anthropic
    handoff_target: true
  codex-cli:
    install_url: https://developers.openai.com/codex/cli
    npm_package: '@openai/codex'
    install_guide:
      mac: '1. 打开官方链接，按文档安装 Codex CLI

        2. 终端执行 codex --version 确认安装成功

        3. 刷新百宝箱后，可在下方应用列表中纳管

        '
      win: '1. 打开官方链接，按文档安装 Codex CLI（Windows）

        2. 在 PowerShell 执行 codex --version 确认安装成功

        3. 刷新百宝箱后，可在下方应用列表中纳管

        '
    uninstall_guide:
      mac: '1. 若通过 npm 安装：npm uninstall -g @openai/codex（以官方文档为准）

        2. 若通过 Homebrew 等安装，使用对应 uninstall 命令

        3. 刷新百宝箱确认已卸载

        '
      win: '1. 若通过 npm 安装：npm uninstall -g @openai/codex（以官方文档为准）

        2. 若在「应用和功能」中有条目，请一并卸载

        3. 刷新百宝箱确认已卸载

        '
    pricing_provider_id: openai
    handoff_target: true
  opencode-cli:
    install_url: https://opencode.ai
    npm_package: opencode-ai
  hermes-cli:
    install_url: https://hermes-agent.nousresearch.com
  deepseek-harness-cli:
    install_url: https://github.com/deepseek-ai/deepseek-harness
    npm_package: '@deepseek-ai/dsh'
  kimi-code-cli:
    install_url: https://moonshotai.github.io/kimi-code/
    install_guide:
      mac: '1. 终端执行：curl -fsSL https://code.kimi.com/kimi-code/install.sh | bash

        2. 执行 kimi --version 确认安装成功

        3. 刷新百宝箱后，可在下方应用列表中纳管

        '
      win: '1. PowerShell 执行：irm https://code.kimi.com/kimi-code/install.ps1 | iex

        2. 执行 kimi --version 确认安装成功

        3. 刷新百宝箱后，可在下方应用列表中纳管

        '
  claude-desktop-api:
    install_url: https://claude.ai/download
    install_guide:
      mac: '1. 打开官方链接下载 Claude for macOS

        2. 安装并登录后，回到网关页在列表中纳管

        3. 若需第三方网关，请先在 Desktop 中启用开发者模式

        '
      win: '1. 打开官方链接下载 Claude for Windows

        2. 安装并登录后，回到网关页在列表中纳管

        3. 若需第三方网关，请先在 Desktop 中启用开发者模式

        '
    uninstall_guide:
      mac: '1. 退出 Claude，从「应用程序」中删除

        2. 可选：删除 ~/Library/Application Support/Claude

        3. 刷新百宝箱确认状态

        '
      win: '1. 退出 Claude，在「设置 → 应用和功能」中卸载

        2. 可选：删除 %APPDATA%\Claude

        3. 刷新百宝箱确认状态

        '
    integrations:
      claude_3p: true
      dev_mode_check: true
  codex-desktop-api:
    install_url: https://developers.openai.com/codex/app
    install_guide:
      mac: '1. 打开官方链接下载 Codex macOS 版

        2. 安装完成后刷新百宝箱

        3. 在下方应用列表中点击「纳管」并绑定路由

        '
      win: '1. 打开官方链接下载 Codex Windows 版

        2. 安装完成后刷新百宝箱

        3. 在下方应用列表中点击「纳管」并绑定路由

        '
  openclaw-api:
    install_url: https://openclaw.ai
    npm_package: openclaw
  cursor-stats:
    install_url: https://cursor.com
    install_guide:
      mac: '1. 打开官方链接下载 macOS 版 Cursor

        2. 拖入「应用程序」文件夹并至少启动一次

        3. 刷新百宝箱；图标变彩色即表示已识别（应用列表纳管）

        4. 若要在「游乐场」使用 Cursor，还需 Agent CLI：curl https://cursor.com/install -fsS | bash
           （或在游乐场侧栏点「一键安装」）

        '
      win: '1. 打开官方链接下载 Windows 安装包

        2. 运行安装程序并至少启动一次

        3. 刷新百宝箱；图标变彩色即表示已识别（应用列表纳管）

        4. 若要在「游乐场」使用 Cursor，还需 Agent CLI：在 PowerShell 执行
           irm https://cursor.com/install?win32=true | iex
           （或在游乐场侧栏点「一键安装」）

        '
    uninstall_guide:
      mac: '1. 退出 Cursor，将应用从「应用程序」中删除

        2. 可选：删除 ~/.cursor 以清除本地数据

        3. 刷新百宝箱确认状态

        '
      win: '1. 退出 Cursor，在「设置 → 应用」中卸载

        2. 可选：删除 %USERPROFILE%\.cursor 以清除本地数据

        3. 刷新百宝箱确认状态

        '
    integrations:
      editor_hook: cursor
    pricing_provider_id: cursor
    handoff_target: true
  copilot-stats:
    install_url: https://github.com/features/copilot
  qwen-stats:
    install_url: https://github.com/QwenLM/qwen-code
  antigravity-stats:
    install_url: https://antigravity.google/download
  grok-stats:
    install_url: https://x.ai/cli
  workbuddy-stats:
    install_url: https://www.codebuddy.ai
  trae-work-stats:
    install_url: https://www.trae.cn
    install_guide:
      mac: '1. 打开 trae.cn 下载 Trae Work / TRAE SOLO CN（macOS）

        2. 安装并至少启动一次、登录官方账号

        3. 在 Token Bank 纳管 Trae Work（官方订阅用量自动统计）

        4. 若要走网关：在 Trae 设置 → 模型 → 添加自定义模型（OpenAI 兼容），参数见下方「网关接入参数」
        · 请求地址：{BASE}/v1/chat/completions
        · API Key：见上方「API Key」
        · 模型 ID：与所选路由 / 网关 /v1/models 列表一致
        · 系统代理（Clash 等）须将 127.0.0.1、localhost 加入绕过/NO_PROXY，
          否则经代理访问本机网关会 502（思考中卡住）

        '
      win: '1. 打开 trae.cn 下载 Trae Work / TRAE SOLO（Windows）

        2. 安装并至少启动一次、登录官方账号

        3. 在 Token Bank 纳管 Trae Work（官方订阅用量自动统计）

        4. 若要走网关：在 Trae 设置 → 模型 → 添加自定义模型（OpenAI 兼容），参数见下方
        · 请求地址：{BASE}/v1/chat/completions
        · API Key：见上方「API Key」
        · 模型 ID：与所选路由 / 网关 /v1/models 列表一致
        · 系统代理须将 127.0.0.1、localhost 加入绕过/NO_PROXY

        '
  trae-stats:
    install_url: https://www.trae.cn
