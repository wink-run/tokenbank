# app-handlers.yaml — 客户端内置应用 handler（代理 + 会话统计逻辑）
# 服务端 / 客户端共用。实体只需 handler + vars；扫描规则见 session-scans.yaml，运营元数据见 handler-ops.yaml。

version: 1

handlers:
  claude-code-cli:
    label: Claude Code CLI
    label_zh: Claude Code CLI
    description: Anthropic CLI · env 注入网关 + 附属会话扫描
    default_icon: "🤖"
    default_name: Claude Code
    capabilities: [gateway_proxy, session_import, resource_project]
    proxy:
      mode: cli
      protocol: anthropic
      strategy: base_url-env
      route_bindable: true
      detect_command: claude
      detect_version_arg: "--version"
      detect_config_dirs: ["$CLAUDE_CONFIG_DIR", "~/.claude"]
      inject_env:
        ANTHROPIC_BASE_URL: "http://{REVERSE}"
        # 只设 BASE_URL、不注入 ANTHROPIC_AUTH_TOKEN：让 claude 用它自己的 claude.ai OAuth 登录态
        # 打网关（网关不校验 caller key、按模型路由），从而不禁用 claude.ai 的组织 connectors。
        # 注：若 Claude Code 拒绝把 OAuth token 发给自定义 base_url，则需回退加回 ANTHROPIC_AUTH_TOKEN: "{KEY}"。
    session:
      source_id: claude
      standalone: false
      activity_agent_id: claude-code
      trace_agent_id: claude-code
      trace:
        profile: claude-jsonl
        entrypoint_data_source: session-claude

  # 遗留 handler：列表不再单独建实体，统一走 codex-desktop-api
  codex-cli:
    label: Codex
    label_zh: Codex
    default_icon: "💻"
    default_name: Codex
    capabilities: [gateway_proxy, session_import, resource_project]
    proxy:
      mode: cli
      protocol: responses
      strategy: base_url-env
      route_bindable: true
      detect_command: codex
      detect_version_arg: "--version"
      inject_env:
        OPENAI_BASE_URL: "http://{REVERSE}/v1"
        OPENAI_API_KEY: "{KEY}"
    session:
      source_id: codex
      standalone: false
      activity_agent_id: codex
      trace_agent_id: codex
      trace:
        profile: codex-rollout

  opencode-cli:
    label: OpenCode CLI
    label_zh: OpenCode CLI
    default_icon: "📝"
    default_name: OpenCode
    capabilities: [gateway_proxy, session_import, resource_project]
    proxy:
      mode: cli
      protocol: openai
      strategy: base_url-env
      route_bindable: true
      detect_command: opencode
      detect_version_arg: "--version"
      detect_config_dirs: ["~/.config/opencode"]
      inject_env:
        OPENAI_BASE_URL: "http://{REVERSE}/v1"
        OPENAI_API_KEY: "{KEY}"
    session:
      source_id: opencode
      standalone: false

  hermes-cli:
    label: Hermes Agent CLI
    label_zh: Hermes Agent CLI
    default_icon: "🧠"
    default_name: Hermes Agent
    capabilities: [gateway_proxy, resource_project]
    proxy:
      mode: cli
      protocol: openai
      strategy: base_url-env
      route_bindable: true
      detect_command: hermes
      detect_version_arg: "--version"
      detect_config_dirs: ["~/.hermes"]
      inject_env:
        OPENAI_BASE_URL: "http://{REVERSE}/v1"
        OPENAI_API_KEY: "{KEY}"

  # DeepSeek Harness（dsh）：配置文件写入法——把网关注册为 $DSH_HOME/settings.yaml 的 llm-pi-ai provider
  # （带全量网关模型），key 写 $DSH_HOME/.credentials.yaml（apiKeyEnv: TOKENBANK_DSH_API_KEY，扁平 mapping）。
  # 必须用独立 env 名：dsh credentials-local 优先读进程环境，TOKENBANK_API_KEY 已被 Codex 写进 shell。
  # settings.yaml 是 dsh 活文档，须合并式写入（保留 ui-onboarding 等用户段）+ 动态模型注入 →
  # 见 main.js apps:writeConfigFile 里 handlerId==='deepseek-harness-cli' 的特化。
  # MCP 资源中转另走 mcp-agent-targets 的 cordis-mcp-client（写 $DSH_HOME/cordis.patch.yml）。
  deepseek-harness-cli:
    label: DeepSeek Harness CLI
    label_zh: DeepSeek Harness CLI
    description: DeepSeek Harness (dsh) · 写 settings.yaml 注册网关 provider + MCP 资源中转
    default_icon: "🐳"
    default_name: DeepSeek Harness
    capabilities: [gateway_proxy, session_import]
    proxy:
      mode: api_key
      route_bindable: true
      allow_direct: false
      detect_type: command
      detect_value: dsh
      config_file: "{DSH_HOME|~/.dsh}/settings.yaml"
      marker: tokenbank
      # 静态段；llm-pi-ai.providers.tokenbank.models 由 patch_route 策略（绑路由多选）或
      # main.js 特化兜底（未绑路由时注入全量网关模型，去重）写入
      patch:
        llm-pi-ai.providers.tokenbank.displayName: tokenbank
        llm-pi-ai.providers.tokenbank.apiKeyEnv: TOKENBANK_DSH_API_KEY
        llm-pi-ai.providers.tokenbank.api: openai-completions
        llm-pi-ai.providers.tokenbank.baseURL: "{BASE}/v1"
        agent-default-model.provider: tokenbank
        agent-default-model.model: deepseek-v4-flash
        agent-default-model.reasoningEffort: high
        agent-presets.default: cordis
      # 绑路由多选 → 所选路由/模型的 id 列表写入 llm-pi-ai.providers.tokenbank.models
      patch_route:
        strategy: tokenbank_models
        models_key: llm-pi-ai.providers.tokenbank.models
        multi_select: true
    # session_import：与 Kimi Code 一样，默认打开会话 trace + 用量补录；云端 vars.capabilities 可单项关闭。
    session:
      source_id: dsh
      standalone: false
      activity_agent_id: deepseek-harness
      trace_agent_id: deepseek-harness
      trace:
        profile: dsh-trace

  # Pi（badlogic/pi）：合并写入 ~/.pi/agent/models.json 的 tokenbank 提供商（OpenAI 兼容），
  # 默认模型写 settings.json 的 defaultProvider/defaultModel。还原只删这一段。
  # 见 main.js handlerId==='pi-cli' 与 pi-config.js。命令 `pi` 或已有 agent 目录才算装上，
  # 不把我们新建的 models.json 当成安装证据。
  pi-cli:
    label: Pi
    label_zh: Pi
    description: Pi 编程代理 · 合并 models.json 注册网关 provider
    default_icon: "π"
    default_name: Pi
    capabilities: [gateway_proxy, session_import]
    proxy:
      mode: api_key
      protocol: openai
      route_bindable: true
      allow_direct: false
      detect_type: command
      detect_value: pi
      detect_command: pi
      detect_version_arg: "--version"
      config_file: "{PI_CODING_AGENT_DIR|~/.pi/agent}/models.json"
      marker: tokenbank
      patch:
        providers.tokenbank.name: Token Bank
        providers.tokenbank.baseUrl: "{BASE}/v1"
        providers.tokenbank.api: openai-completions
        providers.tokenbank.apiKey: "{KEY}"
        providers.tokenbank.authHeader: true
      patch_route:
        strategy: tokenbank_models
        models_key: providers.tokenbank.models
        multi_select: true
    session:
      source_id: pi
      standalone: false
      activity_agent_id: pi
      trace_agent_id: pi

  # OmO（omo-ai / senpi）：Pi 的引擎，配置仍是 agent 目录里的 models.json + settings.json。
  # 目录优先 OMO_CODING_AGENT_DIR，其次 SENPI_CODING_AGENT_DIR；没有 ~/.omo 时回退 ~/.senpi/agent。
  omo-cli:
    label: OmO
    label_zh: OmO
    description: OmO · 合并 models.json 注册网关 provider
    default_icon: "◇"
    default_name: OmO
    capabilities: [gateway_proxy, session_import]
    proxy:
      mode: api_key
      protocol: openai
      route_bindable: true
      allow_direct: false
      detect_type: command
      detect_value: omo
      detect_command: omo
      detect_version_arg: "--version"
      config_file: "{OMO_CODING_AGENT_DIR|~/.omo/agent}/models.json"
      marker: tokenbank
      patch:
        providers.tokenbank.name: Token Bank
        providers.tokenbank.baseUrl: "{BASE}/v1"
        providers.tokenbank.api: openai-completions
        providers.tokenbank.apiKey: "{KEY}"
        providers.tokenbank.authHeader: true
      patch_route:
        strategy: tokenbank_models
        models_key: providers.tokenbank.models
        multi_select: true
    session:
      source_id: omo
      standalone: false
      activity_agent_id: omo
      trace_agent_id: omo

  # Prime Agent：同样读 Pi 的 settings.json / models.json。命令是 prime-agent。
  prime-cli:
    label: Prime Agent
    label_zh: Prime Agent
    description: Prime Agent · 合并 models.json 注册网关 provider
    default_icon: "✦"
    default_name: Prime Agent
    capabilities: [gateway_proxy, session_import]
    proxy:
      mode: api_key
      protocol: openai
      route_bindable: true
      allow_direct: false
      detect_type: command
      detect_value: prime-agent
      detect_command: prime-agent
      detect_version_arg: "--version"
      config_file: "{PRIME_AGENT_CODING_AGENT_DIR|~/.prime/agent}/models.json"
      marker: tokenbank
      patch:
        providers.tokenbank.name: Token Bank
        providers.tokenbank.baseUrl: "{BASE}/v1"
        providers.tokenbank.api: openai-completions
        providers.tokenbank.apiKey: "{KEY}"
        providers.tokenbank.authHeader: true
      patch_route:
        strategy: tokenbank_models
        models_key: providers.tokenbank.models
        multi_select: true
    session:
      source_id: prime
      standalone: false
      activity_agent_id: prime
      trace_agent_id: prime

  # oh-my-pi（omp）：提供商在 models.yml，默认模型是 config.yml 的 modelRoles.default。
  omp-cli:
    label: oh-my-pi
    label_zh: oh-my-pi
    description: oh-my-pi · 合并 models.yml 注册网关 provider
    default_icon: "π"
    default_name: oh-my-pi
    capabilities: [gateway_proxy]
    proxy:
      mode: api_key
      protocol: openai
      route_bindable: true
      allow_direct: false
      detect_type: command
      detect_value: omp
      detect_command: omp
      detect_version_arg: "--version"
      config_file: ~/.omp/agent/models.yml
      marker: tokenbank
      patch:
        providers.tokenbank.name: Token Bank
        providers.tokenbank.baseUrl: "{BASE}/v1"
        providers.tokenbank.api: openai-completions
        providers.tokenbank.apiKey: "{KEY}"
        providers.tokenbank.authHeader: true
      patch_route:
        strategy: tokenbank_models
        models_key: providers.tokenbank.models
        multi_select: true

  # Moonshot Kimi Code CLI：通过 KIMI_MODEL_* 指到网关（Anthropic 兼容协议）
  kimi-code-cli:
    label: Kimi Code CLI
    label_zh: Kimi Code CLI
    description: Moonshot Kimi Code CLI · 经 KIMI_MODEL_* env 注入网关（Anthropic 兼容掩码路由）
    default_icon: "🌙"
    default_name: Kimi Code
    capabilities: [gateway_proxy, session_import, resource_project]
    proxy:
      mode: cli
      protocol: anthropic
      strategy: base_url-env
      route_bindable: true
      detect_command: kimi
      detect_version_arg: "--version"
      detect_config_dirs: ["~/.kimi-code"]
      inject_env:
        KIMI_MODEL_PROVIDER_TYPE: anthropic
        KIMI_MODEL_BASE_URL: "http://{REVERSE}"
        KIMI_MODEL_API_KEY: "{KEY}"
        KIMI_MODEL_NAME: claude-sonnet-4-5
        KIMI_MODEL_DISPLAY_NAME: TokenBank Gateway
    session:
      source_id: kimi
      standalone: false
      activity_agent_id: kimi-code
      trace_agent_id: kimi-code
      trace:
        profile: kimi-code-trace

  claude-desktop-api:
    label: Claude Desktop
    label_zh: Claude Desktop
    default_icon: "🖥️"
    default_name: Claude Desktop
    capabilities: [gateway_proxy]
    proxy:
      mode: api_key
      route_bindable: true
      allow_direct: false
      enable_3p: true
      detect_type: appx
      detect_value: Claude
      config_file: "{CLAUDE_3P_CONFIG}"
      marker: tokenbank
      patch:
        inferenceProvider: gateway
        inferenceGatewayBaseUrl: "{BASE}"
        inferenceGatewayApiKey: "{KEY}"
        inferenceGatewayAuthScheme: bearer
        _configManagedBy: tokenbank
      # 绑路由写入 inferenceModels[]；多选时每条路由一项（name 按 claude_models 列表依次分配）
      patch_route:
        strategy: claude_inference_models
        multi_select: true
    session:
      activity_agent_id: claude-code
      trace_agent_id: claude-code
      linked_data_sources:
        - session-claude-desktop
      trace:
        profile: claude-jsonl
        entrypoint_data_source: session-claude-desktop

  # CLI 与 Desktop 共用 ~/.codex：统一一条实体，写 config.toml + 读 sessions
  codex-desktop-api:
    label: Codex
    label_zh: Codex
    default_icon: "🖥️"
    default_name: Codex
    capabilities: [gateway_proxy, session_import, resource_project]
    proxy:
      mode: api_key
      route_bindable: true
      allow_direct: false
      detect_type: appx
      detect_value: OpenAI.Codex
      # Desktop(appx) 或 PATH 上的 codex 命令任一即可探测
      detect_command: codex
      config_file: "{CODEX_HOME|~/.codex}/config.toml"
      marker: tokenbank
      # Codex Desktop 走客户端 codex-config.js 合并写入(保留 config.toml 其他段)，
      # 下列 patch 为声明式目标配置：base_url 供写入模块取用；requires_openai_auth=true
      # 解锁 Desktop Model 门控，experimental_bearer_token 提供请求 key(替代 env_key，
      # 免依赖系统环境变量)，model_catalog_json 指向自动生成的模型目录(绑定路由的模型)。
      patch:
        model_provider: tokenbank
        model_providers.tokenbank.name: Tokenbank
        model_providers.tokenbank.base_url: "{BASE}/v1"
        model_providers.tokenbank.wire_api: responses
        model_providers.tokenbank.requires_openai_auth: true
        model_providers.tokenbank.experimental_bearer_token: "{KEY}"
        model_catalog_json: tokenbank-codex-catalog.json
      # 绑路由写入 model 字段；多选时取首条为默认模型（网关 keyScene 亦用首条）
      patch_route:
        strategy: codex_model
        multi_select: true
    session:
      source_id: codex
      standalone: false
      activity_agent_id: codex
      trace_agent_id: codex
      linked_data_sources:
        - session-codex
      trace:
        profile: codex-rollout

  openclaw-api:
    label: OpenClaw
    label_zh: OpenClaw
    default_icon: "🦞"
    default_name: OpenClaw
    capabilities: [gateway_proxy, resource_project]
    proxy:
      mode: api_key
      route_bindable: true
      detect_type: command
      detect_value: openclaw
      config_file: "~/.openclaw/openclaw.json"
      marker: tokenbank
      patch:
        models.providers.tokenbank.baseUrl: "{BASE}/v1"
        models.providers.tokenbank.apiKey: "{KEY}"
        models.providers.tokenbank.api: openai-completions

  cursor-stats:
    label: Cursor
    label_zh: Cursor
    default_icon: "🖱"
    default_name: Cursor
    capabilities: [session_import, resource_project]
    session:
      source_id: cursor
      standalone: true
      route_bindable: false
      activity_agent_id: cursor
      trace_agent_id: cursor
      trace:
        profile: cursor-transcript

  copilot-stats:
    label: GitHub Copilot
    label_zh: GitHub Copilot
    default_icon: "🤖"
    default_name: GitHub Copilot
    capabilities: [session_import]
    session:
      source_id: copilot-cli
      standalone: true
      route_bindable: false

  qwen-stats:
    label: Qwen Code
    label_zh: Qwen Code
    default_icon: "🐉"
    default_name: Qwen Code
    capabilities: [session_import]
    session:
      source_id: qwen
      standalone: true
      route_bindable: false

  antigravity-stats:
    label: Antigravity
    label_zh: Antigravity
    default_icon: "🚀"
    default_name: Antigravity
    capabilities: [session_import]
    session:
      source_id: antigravity
      standalone: true
      route_bindable: false

  grok-stats:
    label: Grok
    label_zh: Grok
    default_icon: "✖"
    default_name: Grok
    capabilities: [session_import]
    session:
      source_id: grok
      standalone: true
      route_bindable: false

  workbuddy-stats:
    label: WorkBuddy
    label_zh: WorkBuddy
    default_icon: "🤝"
    default_name: WorkBuddy
    capabilities: [gateway_proxy, session_import]
    proxy:
      mode: api_key
      route_bindable: true
      config_file: "~/.workbuddy/models.json"
      marker: tokenbank
      patch:
        models:
          - id: placeholder
            name: tokenbank
            vendor: TokenBank
            url: "{BASE}/v1/chat/completions"
            apiKey: "{KEY}"
            supportsToolCall: true
            supportsImages: true
      # 绑路由写入：id=场景名/模型 id，name=tokenbank；多路由则 models[] 多条
      patch_route:
        strategy: workbuddy_models
        provider_name: tokenbank
        models_key: models
        multi_select: true
    session:
      source_id: workbuddy
      standalone: true
      route_bindable: true
      activity_agent_id: workbuddy
      trace_agent_id: workbuddy
      trace:
        profile: workbuddy-trace

  trae-work-stats:
    label: Trae Work
    label_zh: Trae Work
    default_icon: "⚡"
    default_name: Trae Work
    # 官方订阅 + 会话导入；自定义模型由用户在 Trae 内手工配置（不写 state.vscdb）
    capabilities: [session_import]
    session:
      source_id: trae-work
      standalone: true
      route_bindable: true
      activity_agent_id: trae-work
      trace_agent_id: trae-work
      trace:
        profile: trae-work-trace

# 默认实体清单（导入时用）
# Codex CLI 与 Desktop 共用 ~/.codex，只保留一条实体（写 config.toml）
default_entities:
  - { id: claude-code, handler: claude-code-cli }
  - { id: codex, handler: codex-desktop-api }
  - { id: opencode, handler: opencode-cli }
  - { id: hermes, handler: hermes-cli }
  - { id: kimi-code, handler: kimi-code-cli }
  - { id: claude-desktop, handler: claude-desktop-api }
  - { id: openclaw, handler: openclaw-api }
  - { id: cursor, handler: cursor-stats }
  - { id: copilot, handler: copilot-stats }
  - { id: qwen-code, handler: qwen-stats }
  - { id: antigravity, handler: antigravity-stats }
  - { id: grok, handler: grok-stats }
  - { id: workbuddy, handler: workbuddy-stats, vars: { route_multi_select: true } }
  - { id: trae-work, handler: trae-work-stats }
  - { id: deepseek-harness, handler: deepseek-harness-cli }
  - { id: pi, handler: pi-cli, vars: { route_multi_select: true } }
  - { id: omo, handler: omo-cli, vars: { route_multi_select: true } }
  - { id: prime, handler: prime-cli, vars: { route_multi_select: true } }
  - { id: omp, handler: omp-cli, vars: { route_multi_select: true } }

# vars 可覆盖字段（管理后台运营配置，下发在 app_entities[].vars）
var_schema:
  capabilities:
    type: object
    label: "用户启用的 Handler 能力"
  route_multi_select: { type: boolean, label: "路由写入支持多选" }
  models: { type: string_list, label: "展示模型（逗号分隔）" }
  route_bindable: { type: boolean, label: "可绑定路由" }
  allow_direct: { type: boolean, label: "允许直连（API Key 应用）" }
  provider_id: { type: string, label: "模型来源 ID" }
  tier: { type: string, label: "档位（paid/free）" }
  billing_type: { type: string, label: "计费类型（subscription/api-key）" }
  data_source: { type: string, label: "数据来源标识" }

# Handler 能力目录（管理后台只读展示）
capability_catalog:
  gateway_proxy:
    label_zh: 应用支持本地网关路由代理
    label_en: Local gateway routing proxy
  session_trace:
    label_zh: 应用支持会话 trace 分析
    label_en: Session trace analysis
  session_usage_import:
    label_zh: 应用用量数据支持会话导入
    label_en: Session usage data import
  resource_project:
    label_zh: 可作为游乐场 / 贡献的 runtime
    label_en: Usable as playground / contribute runtime
