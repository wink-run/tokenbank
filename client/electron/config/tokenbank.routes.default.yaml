# tokenbank.routes.default.yaml
# 已不再由客户端加载。场景路由只从服务端 /api/config/scenes 拉取（syncRemote）。
# 本文件保留作对照；服务端默认见 server/static/defaults/scenes.default.yaml。

version: 1

scene_routes:
  # ── 策略路由（模型无关，无 steps）：网关按请求类型扫该类型下所有(源,模型)候选、按 strategy 排序 + failover。
  #    strategy 逻辑由客户端 routing-strategies.js 里同名 JS 实现。客户端像选场景路由一样选这几个。
  # 默认策略路由：流转策略(flow)= 名字。模型无关、无 steps；网关按 flow 在全候选里选优。
  - id: strategy-auto
    scene_name: 综合最优
    icon: ✨
    model_key: llm-router-auto
    flow: auto
  # 自适应：Thompson 采样从历史结果学出每类请求最优模型；冷启动等同综合最优，越用越准。
  - id: strategy-adaptive
    scene_name: 自适应
    icon: 🧠
    model_key: llm-router-adaptive
    flow: adaptive
  - id: strategy-cost
    scene_name: 实惠优先
    icon: 💰
    model_key: llm-router-cost
    flow: cost
  - id: strategy-speed
    scene_name: 速度优先
    icon: ⚡
    model_key: llm-router-speed
    flow: speed
  - id: strategy-round-robin
    scene_name: 轮询
    icon: 🔄
    model_key: llm-router-round-robin
    flow: round-robin

  # ── 纯来源/价格路由：只按 来源(scope=personal/community) 或 价格(tier=free/paid) 过滤，
  #    层内按 auto 综合最优排序。scope 与 tier 正交，用户可在界面自由组合（如 个人+免费）。
  - id: strategy-free
    scene_name: 免费源
    icon: 🆓
    model_key: llm-router-free
    tier: free
    flow: auto
  - id: strategy-community
    scene_name: 社区源
    icon: 🌐
    model_key: llm-router-community
    scope: community
    flow: auto
  - id: strategy-personal
    scene_name: 个人源
    icon: 👤
    model_key: llm-router-personal
    scope: personal
    flow: auto

  # ── 任务分型模型链路由（预定义模板，仿 OpenCode / DigitalOcean Inference Router）──
  #    每条 = 主模型 + 后备池；flow=fallback（主挂了按列出顺序切后备）。
  #    app 按任务类型调对应 model_key（design/repo-qa/chore/debug）。
  #    steps 只钉 model、不限 tier → 解析到任意拥有该模型的源；用户源不同则自动落到可用那个。
  #    模型名与你实际拥有的源未必都匹配——解析不到的那步会被跳过，可在界面自行替换。
  - id: route-design
    scene_name: design
    icon: 🎨
    model_key: llm-router-design
    flow: fallback
    steps:
      - model: glm-5.1
      - model: deepseek-v4-pro
      - model: minimax-m3
      - model: mimo-v2.5
  - id: route-repo-qa
    scene_name: repo-qa
    icon: 📚
    model_key: llm-router-repo-qa
    flow: fallback
    steps:
      - model: google/gemma-4-31b-it:free
      - model: mimo-v2.5
      - model: minimax-m2.7
      - model: inclusionai/ling-3.0-flash:free
  - id: route-chore
    scene_name: chore
    icon: 🧹
    model_key: llm-router-chore
    flow: fallback
    steps:
      - model: google/gemma-4-26b-a4b-it:free
      - model: google/gemma-4-31b-it:free
      - model: mimo-v2.5
  - id: route-debug
    scene_name: debug
    icon: 🐛
    model_key: llm-router-debug
    flow: fallback
    steps:
      - model: glm-5.1
      - model: deepseek-v4-pro
      - model: minimax-m3
      - model: deepseek-v4-flash
