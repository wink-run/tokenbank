name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/wink-run/local-llm-proxy/gateway

jobs:

  # ── 回归测试（发版前门禁）────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Client tests
        working-directory: client
        run: npm ci && xvfb-run --auto-servernum npm test

      - name: Server tests
        working-directory: server
        run: pip install -r requirements.txt && python3 -m unittest discover -s . -p 'test_*.py' -v

  # ── macOS .dmg ───────────────────────────────────────────────────────────────
  build-mac:
    needs: [test]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # 不使用 setup-node 内置 npm cache，避免 macOS runner 上出现 EEXIST 缓存冲突

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python setuptools (node-gyp needs distutils)
        run: pip install setuptools

      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
        working-directory: client

      - name: Install dependencies
        working-directory: client
        env:
          # 每次 workflow 使用独立缓存目录，规避 ~/.npm/_cacache/tmp EEXIST
          npm_config_cache: /tmp/npm-cache-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "npm ci attempt ${attempt}..."
            npm cache clean --force
            npm ci && exit 0
            echo "npm ci failed, retrying..."
            sleep 3
          done
          exit 1

      # electron-builder 25 用 .p12 密码去 unlock 临时钥匙串（#10066），macos-26 会
      # SecKeychainUnlock 失败。这里按钥匙串自己的密码导入，构建时不再传 CSC_LINK。
      - name: Import Apple signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${MACOS_CERTIFICATE}" ]; then
            echo "MACOS_CERTIFICATE secret is empty"
            exit 1
          fi
          CERT_PATH="${RUNNER_TEMP}/certificate.p12"
          KEYCHAIN_PATH="${RUNNER_TEMP}/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "${MACOS_CERTIFICATE}" | base64 --decode > "${CERT_PATH}"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${CERT_PATH}" \
            -k "${KEYCHAIN_PATH}" \
            -P "${MACOS_CERTIFICATE_PASSWORD}" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          EXISTING_KEYCHAINS="$(security list-keychains -d user | sed 's/"//g')"
          security list-keychains -d user -s "${KEYCHAIN_PATH}" ${EXISTING_KEYCHAINS}
          rm -f "${CERT_PATH}"
          IDENTITIES="$(security find-identity -v -p codesigning "${KEYCHAIN_PATH}")"
          echo "${IDENTITIES}"
          if echo "${IDENTITIES}" | grep -q '0 valid identities found'; then
            echo "No valid codesigning identity in imported keychain"
            exit 1
          fi

      # Apple notarytool 偶发 HTTP 超时（NSURLError -1001）；afterSign 内已重试，整步再兜底一次
      - name: Build (Vite + electron-builder)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: true
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARIZE_MAX_ATTEMPTS: '3'
        working-directory: client
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            echo "=== mac build attempt ${attempt}/2 ==="
            if npm run build -- --publish never; then
              exit 0
            fi
            if [ "${attempt}" -ge 2 ]; then
              exit 1
            fi
            echo "Build failed (often notarize timeout); retrying in 45s..."
            sleep 45
          done
          exit 1

      # Upload .dmg（手动安装）+ .zip（electron-updater 自动更新必需）+ latest-mac.yml
      - uses: actions/upload-artifact@v4
        with:
          name: mac-artifacts
          path: |
            client/dist-app/*.dmg
            client/dist-app/*.zip
            client/dist-app/latest-mac.yml

  # ── Windows .exe ─────────────────────────────────────────────────────────────
  build-windows:
    needs: [test]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Python setuptools (node-gyp needs distutils, removed in Python 3.12+)
        run: pip install setuptools

      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version "$($env:GITHUB_REF_NAME -replace '^v','')" --no-git-tag-version --allow-same-version
        working-directory: client

      - name: Install dependencies
        working-directory: client
        env:
          npm_config_cache: ${{ runner.temp }}\npm-cache-${{ github.run_id }}-${{ github.run_attempt }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          for ($i = 1; $i -le 3; $i++) {
            Write-Host "npm ci attempt $i..."
            npm cache clean --force
            npm ci
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "npm ci failed, retrying..."
            Start-Sleep -Seconds 3
          }
          exit 1

      - name: Build (Vite + electron-builder)
        run: npm run build -- --publish never
        working-directory: client

      # Upload .exe + latest.yml (needed by electron-updater on Windows)
      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            client/dist-app/*.exe
            client/dist-app/latest.yml

  # ── Docker image (ghcr.io) ───────────────────────────────────────────────────
  build-docker:
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/Dockerfile.cli
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── GitHub Release ────────────────────────────────────────────────────────────
  release:
    needs: [build-mac, build-windows, build-docker]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      # 需要完整 tag 历史，才能生成「上一 tag → 当前 tag」changelog
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Download each artifact into its own subdirectory to avoid merge conflicts
      - uses: actions/download-artifact@v4
        with:
          name: mac-artifacts
          path: artifacts/mac

      - uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: artifacts/win

      - name: List downloaded files
        run: find artifacts -type f | sort

      - name: Generate changelog (prev tag → current tag)
        working-directory: client
        env:
          CHANGELOG_TO: ${{ github.ref_name }}
        run: node scripts/gen-changelog.js

      - name: Compose release body
        env:
          IMAGE: ${{ env.IMAGE }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # changelog 在前，下载/Docker 说明在后
          cp client/release-notes.md release-body.md
          cat >> release-body.md <<EOF

          ## 下载

          | 平台 | 文件 | 说明 |
          |---|---|---|
          | macOS | \`.dmg\` | 双击安装，支持自动更新 |
          | Windows | \`.exe\` | NSIS 安装包，支持自动更新 |
          | Docker | 见下方 | 命令行/服务器无界面部署 |

          ## Docker 快速启动

          \`\`\`bash
          # 拉取镜像
          docker pull ${IMAGE}:${TAG}

          # 持久化目录（local-config.json 由网关首次启动自动创建）
          mkdir -p gateway-data/tokenbank

          # 启动
          docker run -d \\
            --name llm-gateway \\
            -p 11430:11430 \\
            -p 11431:11431 \\
            -v ./gateway-data:/data/.llm-agent \\
            -v ./gateway-data/tokenbank:/data/.tokenbank \\
            ${IMAGE}:${TAG}
          \`\`\`

          Web UI: \`http://localhost:11431\`
          LLM 入口: \`OPENAI_BASE_URL=http://localhost:11430/v1\`
          EOF
          echo "----- release-body.md -----"
          cat release-body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # beta/alpha 须标记为 prerelease，否则 GitHub /releases/latest 指向 beta，
          # electron-updater 稳定版客户端会拉 beta 元数据又因 allowPrerelease=false 跳过 → 永不更新
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-rc') }}
          make_latest: ${{ !(contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-rc')) }}
          body_path: release-body.md
          files: |
            artifacts/mac/*.dmg
            artifacts/mac/*.zip
            artifacts/mac/*.yml
            artifacts/win/*.exe
            artifacts/win/*.yml
